project_name: "work-package-manager"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: true
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
definition_of_done:
  - "Typechecks clean (tsc --noEmit) and Biome clean (biome ci)"
  - "Tests added and green (vitest): unit for pure logic, integration where it touches ports"
  - "Public functions documented; no dead code; the core import-boundary rule is not violated"
