name: Private candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify inactive candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require private artifact storage
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.11.9'
          enable-cache: false
      - run: npm ci
      - run: npm run quality:setup
      - name: Restore exact Groma plugin
        run: node node_modules/groma.md/cli.cjs plugin install
      - name: Build once and verify the exact archive
        run: npm run candidate:prepare -- --output "$RUNNER_TEMP/wpm-candidate" --notes .changeset/wpm-vnext.md
      - name: Recheck persisted bytes without rebuilding
        run: npm run candidate:verify -- --output "$RUNNER_TEMP/wpm-candidate"
      - name: Retain private candidate and digest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ github.sha }}
          path: ${{ runner.temp }}/wpm-candidate
          retention-days: 90
          if-no-files-found: error
