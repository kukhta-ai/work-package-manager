name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Go for pinned analyzers
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: uv for isolated Python analyzers
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.11.9'
          enable-cache: false
      - run: npm ci
      - run: npm run quality:setup
      - name: Restore exact Groma plugin
        run: node node_modules/groma.md/cli.cjs plugin install
      - run: npm run quality:ci -- --policy-only
      - name: Private architecture export
        if: github.event.repository.private == true
        run: npm run groma:export -- "$RUNNER_TEMP/wpm-groma" HEAD
      - name: Retain architecture evidence
        if: github.event.repository.private == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: architecture-${{ github.sha }}
          path: ${{ runner.temp }}/wpm-groma
          retention-days: 14
          if-no-files-found: error

  consumer:
    name: Consumer (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24', '26']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Pack the clean committed revision once
        run: npm run --silent package:inspect -- --revision HEAD --output "$RUNNER_TEMP/wpm-packed" > "$RUNNER_TEMP/wpm-inspection.json"
      - name: Lint the exact archive without repacking
        run: node node_modules/publint/src/cli.js "$RUNNER_TEMP/wpm-packed/"*.tgz --strict
      - name: Install and probe the inspected bytes outside the checkout
        run: npm run --silent package:verify-install -- --report "$RUNNER_TEMP/wpm-inspection.json" --output "$RUNNER_TEMP/wpm-consumer" > "$RUNNER_TEMP/wpm-install.json"
      - run: npm run build
      - run: npm test

  required:
    name: Required
    if: always()
    needs: [policy, consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POLICY_RESULT: ${{ needs.policy.result }}
      CONSUMER_RESULT: ${{ needs.consumer.result }}
    steps:
      - name: Require every band, including skips and cancellation
        run: test "$POLICY_RESULT" = success && test "$CONSUMER_RESULT" = success
