# FORWARD NOTE (task-13 -> tasks 30/31): author the template manifest.yml/bundle.yml with SINGLE-SPACE
# inline comments (canonical style). eemeli/yaml normalizes multi-space-before-comment document-wide on any
# edit, so aligned comments would re-flow on a version bump; single-space keeps programmatic edits line-local.
# Phases A+B COMPLETE (1-15: toolchain + model + the 4 ports). Phase C next (16-22: services tier; first up task-16 render).
# DECISION (task-12, cross-cutting): the core is SYNCHRONOUS
