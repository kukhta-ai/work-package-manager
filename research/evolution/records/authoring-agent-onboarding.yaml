observations:
  - statement: The onboarding implementation reached 127 Done Backlog tasks before artifact closeout.
    evidence:
      - backlog task list --plain at pre-cleanup revision 9d28f96903cb3cf9b9cb8765f4f33fd76d07af39
  - statement: The pre-cleanup tree tracked 216 workflow-output files under the two working-memory roots.
    evidence:
      - git ls-files at revision 9d28f96903cb3cf9b9cb8765f4f33fd76d07af39
  - statement: WPM's package boundary already classifies BMAD output and .bmad content as prohibited planning material.
    evidence:
      - distribution-preparation/package-boundary.js
      - test/unit/distribution-preparation/package-boundary.test.ts
  - statement: Frozen sprint snapshots and story projections can contradict the authoritative completed Backlog state.
    evidence:
      - git:9d28f96903cb3cf9b9cb8765f4f33fd76d07af39:_bmad-output/implementation-artifacts/sprint-status-foundation.yaml
      - backlog task list --plain
decisions:
  - decision: Treat conventional BMAD output paths as ignored working memory through their last consumer.
    rationale: Workflows remain usable while generated projections stop competing with canonical docs and Backlog state.
    evidence:
      - PROCESS-ARTIFACTS.md
      - .bmad/artifact-policy.yaml
  - decision: Permanently retain compact evolution records and candidate gate receipts instead of raw workflow transcripts.
    rationale: Decisions, lessons, waivers, and residual risk survive without preserving stale status mirrors and copied evidence.
    evidence:
      - research/evolution/schemas/evolution-record.schema.json
      - research/evolution/schemas/gate-receipt.schema.json
  - decision: Preserve the legacy corpus through a named pre-cleanup Git revision without rewriting history.
    rationale: Historical research remains recoverable while current review sees the smaller active boundary.
    evidence:
      - git revision 9d28f96903cb3cf9b9cb8765f4f33fd76d07af39
